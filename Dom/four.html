<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color:#212121; color:#ffffff">

    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<style>

</style>
<script>
    function addLanguage(langName)
    {
       const li= document.createElement('li')
       li.innerHTML=`${langName}`
       document.querySelector('.language').appendChild(li)
       
    }
    addLanguage('Python')
    addLanguage('C++')

    function addOptioLang(langName)
    {
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langName))
      document.querySelector('.language').appendChild(li)
    }

    addOptioLang('Java')
    addOptioLang('Ruby')


    //edit

    const secondLang = document.querySelector("li:nth-child(2)")
    const newLi = document.createElement('li')
    newLi.textContent = "mojo"
    secondLang.replaceWith(newLi)

    //edit

    const firstLang = document.querySelector('li:first-child')
    firstLang.outerHTML = '<li>TypeScript</li>'

    //remove

    const lastLang = document.querySelector('.language li:last-child')
    lastLang.remove()


    const newEele = document.querySelector('.language')
    const newList = document.createElement('li')
    newList.innerHTML = "GoLang"
    newEele.appendChild(newList)
      </script>
</html>
