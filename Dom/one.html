<!DOCTYPE html>
<html lang="en">
    <head>

        <title> DOM LEARNING </title>
        <style>
            .bg-blac{
                background-color: black;
                color: white;
            }
        </style>

    </head>
    <body>
        <div>
            <h1 id="title" class="heading"><span>DOM</span> Learning on Chai aur code </h1>
            <h1>Demo</h1>
            <h2>Deal</h2>
            
            <p> Lorem ipsum dolor sit amet. </p>
        </div>
        <ul>
            <li class="item_list"> Item 1 </li>
            <li class="item_list"> Item 2 </li>
            <li class="item_list"> Item 3 </li> 
        </ul>
        <script>
           document.getElementById("title").className;
           document.getElementById("title").getAttribute("class");
           document.getElementById("title").style.backgroundColor = "pink";    
            Item=document.getElementById("title");
            Item.style.fontSize = "100px";
            Item.style.backgroundColor = "yellow";
            Item.style.textAlign = "center";
     
           console.log(Item.textContent);
        console.log(Item.innerHTML)
        console.log(Item.innerText)
     

        // Query Selector (will return first html)
        console.log(document.querySelector("h1"));
   
        console.log(document.querySelector("#title"));
        console.log(document.querySelector(".heading"));

        const myul=document.querySelector("ul")
        myul.style.backgroundColor="lightgrey"

        //QuerySelectorAll (return all selectors)
        const ls=document.querySelectorAll('h1');
        console.log(ls);
        ls[0].style.color="green";

        ls.forEach((l)=>{
            l.style.color="green";
        })

   
        const lis=document.getElementsByClassName('item_list')
        converted=Array.from(lis)
        converted.forEach((l)=>{
            l.style.color="blue";
        })
</script>
          </body>
    
</html>
